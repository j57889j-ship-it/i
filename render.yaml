services:
  - type: web
    name: sahifa-quiz
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TARGET_CHANNEL_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: APP_NAME
        value: Sahifa Quiz
      - key: APP_TIMEZONE
        value: Asia/Tashkent
      - key: TOP_LIMIT
        value: "10"
      - key: POINTS_PER_CORRECT
        value: "10"
      - key: DEFAULT_QUIZ_QUESTIONS
        value: "10"
      - key: MAX_QUESTIONS_PER_IMPORT
        value: "100"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: openai/gpt-4.1-nano
      - key: AI_QUIZ_DEFAULT_QUESTIONS
        value: "10"
      - key: AI_QUIZ_MAX_QUESTIONS
        value: "15"
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: sahifa-quiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sahifa-quiz-redis
          property: connectionString

  - type: keyvalue
    name: sahifa-quiz-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: sahifa-quiz-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
